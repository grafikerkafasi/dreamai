name: dream_ai
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+34

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  lottie: ^2.6.0
  google_fonts: ^6.3.3
  purchases_flutter: ^10.9.1
  uuid: ^4.6.0
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_native_splash: ^2.3.10
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  # flutter_native_splash's podspec isn't Swift Package Manager compatible
  # ("public headers directory path... is invalid"), which broke iOS builds
  # once Flutter started enabling SwiftPM integration by default. Falls back
  # to CocoaPods, which every plugin here already supports.
  config:
    enable-swift-package-manager: false
  assets:
    - assets/animations/splash.json
    - assets/splash.png
    - assets/images/homepage-bg.png
    - assets/images/menu.png
    - assets/images/logo.png
    - assets/images/loading.png
    - assets/images/empty_bg.png
    - assets/images/dreamai-icon.png
    - assets/images/interpreters/placeholder.png
    - assets/images/interpreters/nietzsche.png
    - assets/images/interpreters/freud.png
    - assets/images/interpreters/jung.png
    - assets/images/interpreters/yalom.png
    - assets/images/interpreters/alan_watts.png
    - assets/images/interpreters/schopenhauer.png
    - assets/images/interpreters/fortune_teller.png
    - assets/images/interpreters/viktor_frankl.png
    - assets/images/interpreters/carl_rogers.png
    - assets/images/interpreters/dostoyevsky.png
    - assets/images/interpreters/buddha.png
    - assets/images/interpreters/jesus.png
    - assets/images/interpreters/imam.png
    - assets/images/interpreters/rabbi.png
    - assets/images/interpreters/hindu_guru.png
    - assets/images/interpreters/keanu_reeves.png
    - assets/images/interpreters/dwayne_johnson.png
    - assets/images/interpreters/freddie_mercury.png
    - assets/images/interpreters/emma_watson.png
    - assets/images/interpreters/bruce_lee.png

flutter_native_splash:
  color: "#1C263F"
  image: assets/images/loading.png
  android: true
  ios: true
  fullscreen: true

  android_gravity: fill
  ios_content_mode: scaleAspectFill
  web_image_mode: cover

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/dreamai-icon.png"
  remove_alpha_ios: true
  background_color_ios: "#1C263F"
