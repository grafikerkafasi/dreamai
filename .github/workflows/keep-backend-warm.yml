name: Keep backend warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sS -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" https://dreamai-backend-mkit.onrender.com/health
