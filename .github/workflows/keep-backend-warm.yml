name: Keep backend warm

on:
  schedule:
    # Every 10 min from 07:00 to 02:00 Turkey time (UTC+3), i.e. 04:00-22:59 UTC.
    # Nights are skipped so the free instance can sleep and save Render hours.
    - cron: '*/10 4-22 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sS -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" https://dreamai-backend-mkit.onrender.com/health
