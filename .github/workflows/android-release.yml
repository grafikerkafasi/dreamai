name: Android Release Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # No pinned version: always resolves the current stable, which is
          # required to stay above Flutter 3.35 (default targetSdk 36) for
          # Google Play's Android 16 target API requirement.

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/sanai-upload-key.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=sanai-upload-key.jks
          EOF

      - name: Build release App Bundle
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          REVENUECAT_API_KEY_ANDROID: ${{ secrets.REVENUECAT_API_KEY_ANDROID }}
        run: |
          flutter build appbundle --release \
            --dart-define=USE_DEMO_ANALYSIS=false \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=REVENUECAT_API_KEY_ANDROID="$REVENUECAT_API_KEY_ANDROID"

      - name: Upload AAB as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dreamai-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
